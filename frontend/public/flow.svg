<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" style="background-color:#0d1117; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;">
  <defs>
    <style>
      .box { fill: #161b22; stroke: #30363d; stroke-width: 2px; rx: 0; }
      .box-highlight { fill: #1f2937; stroke: #58a6ff; stroke-width: 2px; rx: 0; }
      .text-step { fill: #58a6ff; font-size: 14px; font-weight: 600; }
      .text-title { fill: #c9d1d9; font-size: 15px; font-weight: 600; }
      .text-desc { fill: #8b949e; font-size: 12px; }
      
      .animated-line { stroke: #58a6ff; stroke-width: 1.5px; fill: none; stroke-dasharray: 6, 6; animation: flow 1s linear infinite; }
      .animated-line-success { stroke: #3fb950; stroke-width: 1.5px; fill: none; stroke-dasharray: 6, 6; animation: flow 1s linear infinite; }
      
      @keyframes flow { to { stroke-dashoffset: -12; } }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polyline points="2 2, 6 4, 2 6" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="square" />
    </marker>
    <marker id="arr-suc" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polyline points="2 2, 6 4, 2 6" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-linecap="square" />
    </marker>
  </defs>

  <text x="500" y="40" class="text-title" style="font-size:18px; fill:#58a6ff; text-anchor:middle;">Escrow Mechanics &amp; Data Flow</text>

  <!-- Step 1 -->
  <rect x="50" y="100" width="200" height="80" class="box" />
  <text x="70" y="130" class="text-step">01. Observation</text>
  <text x="70" y="155" class="text-desc">Webhook or MCP Proxy</text>
  
  <!-- Step 2 -->
  <rect x="300" y="100" width="200" height="80" class="box" />
  <text x="320" y="130" class="text-step">02. Analysis</text>
  <text x="320" y="155" class="text-desc">Conformal &amp; Semantic</text>

  <!-- Step 3 -->
  <rect x="550" y="100" width="200" height="80" class="box-highlight" />
  <text x="570" y="130" class="text-step">03. Decisioning</text>
  <text x="570" y="155" class="text-desc">Score evaluation</text>

  <!-- Step 4 Outcomes -->
  <rect x="800" y="40" width="150" height="60" class="box" style="stroke:#2ea043;" />
  <text x="820" y="65" class="text-title" style="fill:#2ea043;">Release</text>
  <text x="820" y="85" class="text-desc">Immediate</text>

  <rect x="800" y="110" width="150" height="60" class="box" style="stroke:#d29922;" />
  <text x="820" y="135" class="text-title" style="fill:#d29922;">Hold (Escrow)</text>
  <text x="820" y="155" class="text-desc">Max 48 hours</text>

  <rect x="800" y="180" width="150" height="60" class="box" style="stroke:#f85149;" />
  <text x="820" y="205" class="text-title" style="fill:#f85149;">Refuse</text>
  <text x="820" y="225" class="text-desc">Refunded</text>

  <!-- Resolution for Hold -->
  <rect x="800" y="280" width="150" height="60" class="box" />
  <text x="820" y="305" class="text-step">04. Resolution</text>
  <text x="820" y="325" class="text-desc">Review or Timeout</text>

  <!-- Connecting Lines -->
  <!-- Observation to Analysis -->
  <path d="M 250 140 L 295 140" class="animated-line" marker-end="url(#arr)" />
  <!-- Analysis to Decisioning -->
  <path d="M 500 140 L 545 140" class="animated-line" marker-end="url(#arr)" />
  
  <!-- Decisioning to Outcomes -->
  <path d="M 750 120 L 775 120 L 775 70 L 795 70" class="animated-line" marker-end="url(#arr)" />
  <path d="M 750 140 L 795 140" class="animated-line" marker-end="url(#arr)" />
  <path d="M 750 160 L 775 160 L 775 210 L 795 210" class="animated-line" marker-end="url(#arr)" />

  <!-- Hold to Resolution -->
  <path d="M 875 170 L 875 275" class="animated-line" marker-end="url(#arr)" />
  
  <!-- Resolution to Release -->
  <path d="M 800 310 L 730 310 L 730 70 L 795 70" class="animated-line-success" marker-end="url(#arr-suc)" />
  
  <text x="660" y="295" class="text-desc" style="fill:#3fb950;">Default to Safe Release</text>

</svg>
